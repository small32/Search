name: Bilingual interface checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  localization:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test language selection and translation formatting
        run: swift test --filter LocalizationTests
      - name: Build ARM64 application with both languages
        env:
          SEARCH_ARCH: arm64
        run: ./build.sh release
      - name: Verify packaged translations and signature
        run: |
          test -f build/Search.app/Contents/Resources/Search_Search.bundle/Contents/Resources/Translations.json
          plutil -lint build/Search.app/Contents/Resources/en.lproj/InfoPlist.strings
          plutil -lint build/Search.app/Contents/Resources/zh-Hans.lproj/InfoPlist.strings
          codesign --verify --deep --strict build/Search.app
