name: Bilingual interface checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  localization:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test language selection and start-page behavior
        run: swift test --filter 'LocalizationTests|StartPageTests'
      - name: Build ARM64 application with both languages
        env:
          SEARCH_ARCH: arm64
        run: ./build.sh release
      - name: Verify packaged translations and signature
        run: |
          swift -e '
            import Foundation
            let app = Bundle(path: "build/Search.app")!
            let resources = Bundle(url: app.resourceURL!.appendingPathComponent("Search_Search.bundle"))!
            let file = resources.url(forResource: "Translations", withExtension: "json")!
            let translations = try! JSONDecoder().decode([String: [String: String]].self, from: Data(contentsOf: file))
            precondition(translations["language.title"]?["en"] == "Language")
            precondition(translations["language.title"]?["zh-Hans"] == "界面语言")
          '
          plutil -lint build/Search.app/Contents/Resources/en.lproj/InfoPlist.strings
          plutil -lint build/Search.app/Contents/Resources/zh-Hans.lproj/InfoPlist.strings
          codesign --verify --deep --strict build/Search.app
