name: ARM64 Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build
        required: true
        default: v0.1.0
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish ARM64
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      SEARCH_ARCH: arm64
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          test "$RELEASE_TAG" = "v$version"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_ARCHIVE=Search-$version-arm64.zip" >> "$GITHUB_ENV"
          xcodebuild -version
          swift --version

      - name: Build Release for ARM64
        run: ./build.sh release

      - name: Verify and package application
        shell: bash
        run: |
          set -euo pipefail
          app="build/Search.app"
          test "$(lipo -archs "$app/Contents/MacOS/Search")" = arm64
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$RELEASE_VERSION"
          plutil -lint "$app/Contents/Info.plist"
          codesign --verify --deep --strict "$app"
          ditto -c -k --keepParent "$app" "build/$RELEASE_ARCHIVE"
          (cd build && shasum -a 256 "$RELEASE_ARCHIVE" > SHA256SUMS.txt)

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          支持英文和简体中文，包含菜单、设置项及说明、弹窗和操作提示。

          在“设置 → 通用 → 界面语言”中选择跟随系统、English 或简体中文，重新启动 Search 后生效。

          - 仅提供 ARM64 版本，适用于 Apple 芯片 Mac。
          - 系统要求：macOS 14 或更新版本；Chrome 扩展需要 macOS 15.4 或更新版本。
          - 下载 ZIP 后解压，将 Search.app 放入“应用程序”文件夹。
          - 安装包由 GitHub Actions 构建，采用临时签名，未进行 Apple 公证。
          - SHA256SUMS.txt 提供安装包的 SHA-256 校验值。
          NOTES
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "build/$RELEASE_ARCHIVE" build/SHA256SUMS.txt --clobber
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag --draft \
              --title "Search ${RELEASE_VERSION}（ARM64）" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              "build/$RELEASE_ARCHIVE" build/SHA256SUMS.txt
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest
